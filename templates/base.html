<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark light">
    <meta name="description" content="{{ description }}">
    <meta name="robots" content="index,follow">
    <link rel="canonical" href="{{ canonical_url }}">
    <meta property="og:type" content="website">
    <meta property="og:title" content="{{ title }} — YouTube Playlist Length">
    <meta property="og:description" content="{{ description }}">
    <meta property="og:url" content="{{ canonical_url }}">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="{{ title }} — YouTube Playlist Length">
    <meta name="twitter:description" content="{{ description }}">
    <title>{{ title }} — YouTube Playlist Length</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/css/styles.css') }}">
    <script defer src="{{ url_for('static', path='/js/site.js') }}"></script>
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="/" aria-label="Midnight Aurora playlist analyzer home">
          <span class="brand-name">MIDNIGHT AURORA</span>
          <span class="version">v3.0</span>
        </a>
        <nav class="tool-nav" aria-label="YouTube tools">
          <a href="/" {% if page == "home" %}aria-current="page"{% endif %}>Playlist Length</a>
          <a href="/thumbnails" {% if page == "thumbnails" %}aria-current="page"{% endif %}>Thumbnail Downloader</a>
          <a href="/timestamp" {% if page == "timestamp" %}aria-current="page"{% endif %}>Timestamp Generator</a>
        </nav>
        <div class="header-actions">
          <button class="icon-button theme-toggle" type="button" aria-label="Switch to light mode" title="Switch theme">
            <span class="theme-icon" aria-hidden="true">☼</span>
          </button>
          <a class="icon-button github-link" href="https://github.com/devstryingtocode-netizen/youtube-watchtime-tool" aria-label="This project on GitHub" title="GitHub">
            <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false"><path d="M12 .9a11.1 11.1 0 0 0-3.51 21.63c.56.1.76-.24.76-.54v-2.1c-3.1.68-3.76-1.31-3.76-1.31-.5-1.3-1.24-1.65-1.24-1.65-1.01-.7.08-.69.08-.69 1.12.08 1.71 1.15 1.71 1.15 1 .1.77 2.7 3.17 1.92.1-.73.39-1.23.7-1.51-2.48-.28-5.09-1.24-5.09-5.52 0-1.22.44-2.22 1.15-3-.12-.28-.5-1.42.11-2.96 0 0 .94-.3 3.06 1.15a10.7 10.7 0 0 1 5.57 0c2.12-1.45 3.05-1.15 3.05-1.15.61 1.54.23 2.68.12 2.96.72.78 1.14 1.78 1.14 3 0 4.29-2.61 5.23-5.1 5.51.4.35.75 1.02.75 2.06v3.14c0 .3.2.65.77.54A11.1 11.1 0 0 0 12 .9Z"/></svg>
          </a>
        </div>
      </div>
    </header>

    <main class="page-content">
      {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
      <nav class="footer-links" aria-label="Related tools">
        <a href="/" {% if page == "home" %}aria-current="page"{% endif %}>Playlist Length</a>
        <span aria-hidden="true">•</span>
        <a href="/thumbnails" {% if page == "thumbnails" %}aria-current="page"{% endif %}>Thumbnail Downloader</a>
        <span aria-hidden="true">•</span>
        <a href="/timestamp" {% if page == "timestamp" %}aria-current="page"{% endif %}>Timestamp Generator</a>
        <span aria-hidden="true">•</span>
        <a href="https://github.com/devstryingtocode-netizen/youtube-watchtime-tool">GitHub project</a>
      </nav>
      <p>© 2026 YouTube Playlist Length — made with <span class="heart" aria-label="love">♥</span> by Sharat Sachin</p>
    </footer>
  </body>
</html>
